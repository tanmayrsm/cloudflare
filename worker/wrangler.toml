name = "docs-agent-worker"
main = "src/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

[vars]
ALLOWED_ORIGIN = "https://tanmay-worker-agent.pages.dev"

# Override ALLOWED_ORIGIN with your deployed frontend's origin before going to production:
#   wrangler secret put ALLOWED_ORIGIN
